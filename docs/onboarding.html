<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexTemplates 2.0 — Interactive Onboarding</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #dbeafe;
            --accent: #f59e0b;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #ffffff;
            --bg-light: #f9fafb;
            --border: #e5e7eb;
            --success: #10b981;
            --info: #06b6d4;
            --warning: #f97316;
            --layer-bg: #fef3c7;
            --layer-border: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2rem 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .section {
            margin-bottom: 3rem;
            scroll-margin-top: 80px;
        }

        .section h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }

        .section h3 {
            font-size: 1.3rem;
            color: var(--text);
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .footer {
            background: var(--bg-light);
            border-top: 1px solid var(--border);
            padding: 2rem 1rem;
            text-align: center;
            margin-top: 3rem;
            color: var(--text-light);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="header">
        <div class="header-content">
            <h1>FlexTemplates 2.0</h1>
            <p class="tagline">A LEGO-pattern Python framework: Flet UI + FastAPI + SQLAlchemy</p>
        </div>
    </nav>

    <main class="container">
        <!-- Sections will be added in Tasks 2-5 -->
    </main>

    <footer class="footer">
        <p>&copy; 2026 FlexTemplates. <a href="https://github.com/QuantumWolf-flex-templates">GitHub</a></p>
    </footer>

    <script>
        // JavaScript will be added in Task 5
    </script>
</body>
</html>
