[project]
name = "flex-templates"
version = "2.0.0"
description = "Modular Flet + FastAPI template with standardized contracts and DI"
readme = "docs/QUICKSTART.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies — what the app needs to run.
dependencies = [
    "flet>=0.84",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "redis>=5.0",
    "pandas>=2.0",
]

# Development extras — install with: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Future extras to enable phase-by-phase as you reach them in the plan.
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.27",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.12",
]
vault = [
    "cryptography>=42.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*"]
exclude = ["original*", "tests*", "docs*"]

# pytest config (replaces pytest.ini)
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
