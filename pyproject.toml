[project]
name = "flex-templates"
version = "2.0.0"
description = "Modular Flet + FastAPI template with standardized contracts and DI"
readme = "docs/QUICKSTART.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies — what the app needs to run.
dependencies = [
    "flet>=0.84",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=42.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "redis>=5.0",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

# Development extras — install with: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.20",
    "anyio[trio]>=4.0",
]

[project.scripts]
flex-encrypt = "lib.config.cli:flex_encrypt"
flex-decrypt = "lib.config.cli:flex_decrypt"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*"]
exclude = ["original*", "tests*", "docs*"]

# pytest config (replaces pytest.ini)
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
